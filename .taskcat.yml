---
# taskcat configuration for connect-fis-acgr-sample.
#
# Only FOUR pre-existing values are needed now. The template creates its own VPC
# (CreateVpc=true, the default) and resolves the FIS Lambda extension layer ARN from the
# AWS public SSM parameter, so neither has to be supplied.
#
# Still not bootstrappable by taskcat, because ACGR onboarding requires AWS Enterprise
# Support and your account team:
#   * an ACGR-paired Connect instance (the SAME instance id exists in both regions)
#   * a Traffic Distribution Group with a PORTED phone number attached
#
# And one that is a chicken-and-egg problem rather than an ACGR one:
#   * an S3 bucket holding the Lambda zips, because the zips must exist before the stack
#     is created. `make bootstrap REGION=<r>` creates it and uploads them.
#
# Scope: taskcat here validates that the template PARSES and its parameters RESOLVE in both
# regions, and that the stacks reach CREATE_COMPLETE. It does NOT exercise the experiments —
# those need real inbound calls. See RUNBOOK.md.
#
# IMPORTANT: a stack reaching CREATE_COMPLETE does not mean the sample WORKS. Three steps
# remain that CloudFormation cannot perform (seed the tables, associate the phone number
# with the contact flow, reset the traffic distribution). Run `make post-deploy` and then
# `make verify` afterwards. Skipping the phone-number association is a silent failure:
# every resource reports CREATE_COMPLETE and every alarm reports OK while calls never
# reach the flow.
#
# Usage:
#   pip install taskcat
#   # populate the SSM parameters referenced below in your sandbox account
#   make bootstrap REGION=us-east-1
#   make bootstrap REGION=us-west-2
#   taskcat test run --no-delete    # keeps the stacks for inspection
#   taskcat test clean ALL          # tears them down

project:
  name: connect-fis-acgr-sample
  package_lambda: false
  regions:
    - us-east-1
    - us-west-2

tests:
  # Deploy the PRIMARY region first: it owns the DynamoDB global tables, both contact flows,
  # the overflow queue and the source Lex bot. The paired-region test below needs the Lex
  # bot/alias ids this stack outputs.
  primary-region:
    template: cfn/main-template.yaml
    regions:
      - us-east-1
    parameters:
      ConnectInstanceArn: $[taskcat_ssm_/taskcat/connect/instance_arn_iad]
      ConnectInstanceId: $[taskcat_ssm_/taskcat/connect/instance_id_iad]
      PrimaryRegion: us-east-1
      PairedRegion: us-west-2
      TrafficDistributionGroupId: $[taskcat_ssm_/taskcat/connect/tdg_id]
      LambdaCodeBucket: $[taskcat_ssm_/taskcat/code/bucket_iad]
      # CreateVpc defaults to true -> VPC, two private subnets and free DynamoDB/S3
      # gateway endpoints are created. No subnet, security group or NAT input needed.
      CreateVpc: 'true'
      # FISExtensionLayerArn is deliberately omitted: it defaults to the AWS public SSM
      # parameter and resolves per region. Both the publishing account AND the version
      # differ per region, so a hand-supplied value is a common silent error.
      EnableAutoFailover: 'true'
      EnableLexGlobalResiliency: 'true'
      EnableTrafficGenerator: 'true'
      DashboardType: regional

  # The paired region creates NO Lex bot: with Lex GR on it reuses the replicated bot and
  # alias ids, which must be supplied. Populate these two SSM parameters from the primary
  # stack's LexBotId / LexBotAliasId outputs before running this test.
  #
  # Outside taskcat, `make deploy-pair` does this handoff automatically.
  paired-region:
    template: cfn/main-template.yaml
    regions:
      - us-west-2
    parameters:
      ConnectInstanceArn: $[taskcat_ssm_/taskcat/connect/instance_arn_pdx]
      ConnectInstanceId: $[taskcat_ssm_/taskcat/connect/instance_id_pdx]
      PrimaryRegion: us-east-1
      PairedRegion: us-west-2
      TrafficDistributionGroupId: $[taskcat_ssm_/taskcat/connect/tdg_id]
      LambdaCodeBucket: $[taskcat_ssm_/taskcat/code/bucket_pdx]
      CreateVpc: 'true'
      EnableAutoFailover: 'true'
      EnableLexGlobalResiliency: 'true'
      EnableTrafficGenerator: 'true'
      DashboardType: regional
      ReplicatedLexBotId: $[taskcat_ssm_/taskcat/lex/bot_id]
      ReplicatedLexBotAliasId: $[taskcat_ssm_/taskcat/lex/alias_id]
