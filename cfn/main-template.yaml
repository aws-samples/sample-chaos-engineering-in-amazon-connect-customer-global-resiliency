AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Amazon Connect FIS Chaos Engineering — ACGR Failover (StackSet-Ready)
  Deploy via StackSet to both primary and paired regions.
  Uses IsPrimaryRegion condition to control region-specific resources.

# ═══════════════════════════════════════════════════════════════
# PARAMETERS
# ═══════════════════════════════════════════════════════════════
Parameters:

  ConnectInstanceArn:
    Type: String
    Description: ARN of the Connect instance in THIS region
    AllowedPattern: 'arn:aws:connect:[a-z0-9-]+:[0-9]+:instance/[a-z0-9-]+'

  ConnectInstanceId:
    Type: String
    Description: Connect Instance ID (UUID) for THIS region

  PrimaryRegion:
    Type: String
    Description: Primary ACGR region
    Default: us-east-1
    AllowedValues: [us-east-1, us-west-2, ap-northeast-1, ap-northeast-3, eu-central-1, eu-west-2]

  PairedRegion:
    Type: String
    Description: Paired ACGR region
    Default: us-west-2
    AllowedValues: [us-east-1, us-west-2, ap-northeast-1, ap-northeast-3, eu-central-1, eu-west-2]
  TrafficDistributionGroupId:
    Type: String
    Description: Traffic Distribution Group ID for ACGR failover

  EnableAutoFailover:
    Type: String
    Description: Deploy EventBridge + TrafficShift Lambda for automatic failover
    AllowedValues: ['true', 'false']
    Default: 'false'

  DashboardType:
    Type: String
    Description: 'regional = per-region dashboard; unified = single cross-region dashboard in primary'
    AllowedValues: ['regional', 'unified']
    Default: regional

  LambdaSubnetIdA:
    Type: AWS::EC2::Subnet::Id
    Description: First VPC subnet for Lambda (also targeted by FIS Experiment 2 DDB disruption)

  LambdaSubnetIdB:
    Type: AWS::EC2::Subnet::Id
    Description: Second VPC subnet for Lambda (also targeted by FIS Experiment 2 DDB disruption)

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group for Lambda VPC config

  LambdaCodeBucket:
    Type: String
    Description: Pre-existing S3 bucket with Lambda .zip packages

  FISExtensionLayerArn:
    Type: String
    Description: AWS FIS Lambda extension layer ARN for this region

  ContactFlowErrorsThreshold:
    Type: Number
    Default: 5

  RuntimeLambdaErrorsThreshold:
    Type: Number
    Default: 3

  MissedCallsThreshold:
    Type: Number
    Default: 5

  FISExperimentDuration:
    Type: String
    Default: PT5M

  EnableTrafficGenerator:
    Type: String
    Description: Deploy optional synthetic traffic generator Lambda (for testing alarms without real calls)
    AllowedValues: ['true', 'false']
    Default: 'false'

  EnableLexGlobalResiliency:
    Type: String
    Description: >-
      Use Amazon Lex Global Resiliency to replicate the Lex V2 bot from primary to paired.
      Strongly recommended (default 'true') because Lex GR preserves bot ID and alias ARN
      across regions — so the contact flow's hardcoded Lex alias ARN remains valid after
      ACGR replicates the flow to the paired region. Set to 'false' only if Lex GR is not
      available for your account; you must then run the post-deploy script in
      scripts/wire-paired-flow.sh to rewrite the paired-region flow content.
    AllowedValues: ['true', 'false']
    Default: 'true'

  ReplicatedLexBotId:
    Type: String
    Description: >-
      (Paired region only, when EnableLexGlobalResiliency=true.) The Lex bot ID emitted
      by the primary-region stack output `LexBotId`. Lex GR preserves the same ID in the
      paired region. Pass empty string ("") in primary region.
    Default: ''

  ReplicatedLexBotAliasId:
    Type: String
    Description: >-
      (Paired region only, when EnableLexGlobalResiliency=true.) The Lex bot alias ID
      emitted by the primary-region stack output `LexBotAliasId`.
      Pass empty string ("") in primary region.
    Default: ''

  PairedConnectInstanceId:
    Type: String
    Description: >-
      (Primary region only, when DashboardType=unified.) The paired-region Connect
      instance ID. Used to render the paired-region panels of the unified dashboard.
      Pass empty string ("") in paired region or when DashboardType=regional.
    Default: ''


# ═══════════════════════════════════════════════════════════════
# RULES — enforce ACGR-supported region pair before any resource is created
# ═══════════════════════════════════════════════════════════════
# Ref: https://docs.aws.amazon.com/connect/latest/adminguide/create-replica-connect-instance.html
#   • us-east-1 ↔ us-west-2
#   • eu-west-2 ↔ eu-central-1
#   • ap-northeast-1 ↔ ap-northeast-3   (one-directional: replica must be ap-northeast-3)
Rules:
  ValidACGRPair:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref PrimaryRegion, us-east-1]
            - !Equals [!Ref PairedRegion, us-west-2]
          - !And
            - !Equals [!Ref PrimaryRegion, us-west-2]
            - !Equals [!Ref PairedRegion, us-east-1]
          - !And
            - !Equals [!Ref PrimaryRegion, eu-west-2]
            - !Equals [!Ref PairedRegion, eu-central-1]
          - !And
            - !Equals [!Ref PrimaryRegion, eu-central-1]
            - !Equals [!Ref PairedRegion, eu-west-2]
          - !And
            - !Equals [!Ref PrimaryRegion, ap-northeast-1]
            - !Equals [!Ref PairedRegion, ap-northeast-3]
        AssertDescription: >-
          PrimaryRegion + PairedRegion must form an ACGR-supported pair:
          us-east-1/us-west-2, eu-west-2/eu-central-1, or ap-northeast-1/ap-northeast-3.

  # Lex Global Resiliency currently supports IAD/PDX and LDN/FRA only.
  # Tokyo/Osaka customers must run with EnableLexGlobalResiliency=false (per-region Lex deploy)
  # and use the post-deploy script to wire the paired-region contact flow.
  LexGRPairAvailable:
    RuleCondition: !Equals [!Ref EnableLexGlobalResiliency, 'true']
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref PrimaryRegion, us-east-1]
            - !Equals [!Ref PairedRegion, us-west-2]
          - !And
            - !Equals [!Ref PrimaryRegion, us-west-2]
            - !Equals [!Ref PairedRegion, us-east-1]
          - !And
            - !Equals [!Ref PrimaryRegion, eu-west-2]
            - !Equals [!Ref PairedRegion, eu-central-1]
          - !And
            - !Equals [!Ref PrimaryRegion, eu-central-1]
            - !Equals [!Ref PairedRegion, eu-west-2]
        AssertDescription: >-
          Lex Global Resiliency currently supports only us-east-1/us-west-2 and
          eu-west-2/eu-central-1 region pairs. For ap-northeast-1/ap-northeast-3,
          set EnableLexGlobalResiliency=false and run scripts/wire-paired-flow.sh
          after deploy to wire the paired-region contact flow to its independent Lex bot.

# ═══════════════════════════════════════════════════════════════
# CONDITIONS
# ═══════════════════════════════════════════════════════════════
Conditions:
  IsPrimaryRegion: !Equals [!Ref 'AWS::Region', !Ref PrimaryRegion]
  DeployAutoFailover: !Equals [!Ref EnableAutoFailover, 'true']
  DeployRegionalDashboard: !Equals [!Ref DashboardType, 'regional']
  DeployUnifiedDashboard: !And
    - !Equals [!Ref DashboardType, 'unified']
    - !Condition IsPrimaryRegion
  DeployTrafficGenerator: !Equals [!Ref EnableTrafficGenerator, 'true']
  UseLexGR: !Equals [!Ref EnableLexGlobalResiliency, 'true']

  # Source-side Lex GR replication is declared on the bot in the primary region only.
  UseLexGRPrimary: !And
    - !Condition UseLexGR
    - !Condition IsPrimaryRegion

  # When Lex GR is on, the Lex bot is created ONLY in the primary region; Lex GR replicates
  # it to the paired region. When Lex GR is off, the bot is created independently per region.
  CreateLexLocally: !Or
    - !Condition IsPrimaryRegion
    - !Not [!Condition UseLexGR]

# ═══════════════════════════════════════════════════════════════
# RESOURCES
# ═══════════════════════════════════════════════════════════════
Resources:

  # ═══════════════════════════════════════════════════════════
  # PRIMARY REGION ONLY
  # ═══════════════════════════════════════════════════════════

  CustomerTable:
    Type: AWS::DynamoDB::GlobalTable
    Condition: IsPrimaryRegion
    Properties:
      TableName: ConnectChaosCustomers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH
      Replicas:
        - Region: !Ref PrimaryRegion
          Tags:
            - Key: FISExperiment
              Value: ConnectChaos
        - Region: !Ref PairedRegion
          Tags:
            - Key: FISExperiment
              Value: ConnectChaos
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  ChaosConfigTable:
    Type: AWS::DynamoDB::GlobalTable
    Condition: IsPrimaryRegion
    Properties:
      TableName: ConnectChaosConfig
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: config_key
          AttributeType: S
      KeySchema:
        - AttributeName: config_key
          KeyType: HASH
      Replicas:
        - Region: !Ref PrimaryRegion
          Tags:
            - Key: FISExperiment
              Value: ConnectChaos
        - Region: !Ref PairedRegion
          Tags:
            - Key: FISExperiment
              Value: ConnectChaos
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  MainIVRFlow:
    Type: AWS::Connect::ContactFlow
    Condition: IsPrimaryRegion
    Properties:
      InstanceArn: !Ref ConnectInstanceArn
      Name: ConnectChaos-MainIVR
      Type: CONTACT_FLOW
      Description: Main IVR with Lex bot — ACGR auto-replicates to paired region
      Content: !Sub |
        {"Version":"2019-10-30","StartAction":"entry","Actions":[{"Identifier":"entry","Type":"MessageParticipant","Parameters":{"Text":"Welcome to customer service. I can help you look up your account or check an order."},"Transitions":{"NextAction":"lex-input","Errors":[{"NextAction":"error-msg","ErrorType":"NoMatchingError"}]}},{"Identifier":"lex-input","Type":"ConnectParticipantWithLexBot","Parameters":{"LexV2Bot":{"AliasArn":"${ConnectChaosBotAlias.Arn}"}},"Transitions":{"NextAction":"success-msg","Conditions":[{"NextAction":"success-msg","Condition":{"Operator":"Equals","Operands":["LookupCustomer"]}},{"NextAction":"success-msg","Condition":{"Operator":"Equals","Operands":["CheckOrderStatus"]}}],"Errors":[{"NextAction":"error-msg","ErrorType":"NoMatchingError"},{"NextAction":"error-msg","ErrorType":"NoMatchingCondition"}]}},{"Identifier":"success-msg","Type":"MessageParticipant","Parameters":{"Text":"I found your information. Transferring to an agent."},"Transitions":{"NextAction":"disconnect","Errors":[{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"error-msg","Type":"MessageParticipant","Parameters":{"Text":"We are experiencing difficulties. Please try again later."},"Transitions":{"NextAction":"disconnect","Errors":[{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"disconnect","Type":"DisconnectParticipant","Parameters":{},"Transitions":{}}]}

  ChaosTestFlow:
    Type: AWS::Connect::ContactFlow
    Condition: IsPrimaryRegion
    Properties:
      InstanceArn: !Ref ConnectInstanceArn
      Name: ConnectChaos-ChaosTest
      Type: CONTACT_FLOW
      Description: Chaos test flow — routes failed calls to overflow (MissedCalls metric)
      Content: !Sub |
        {"Version":"2019-10-30","StartAction":"entry","Actions":[{"Identifier":"entry","Type":"MessageParticipant","Parameters":{"Text":"Welcome. Let me look up your information."},"Transitions":{"NextAction":"lex-input","Errors":[{"NextAction":"error-path","ErrorType":"NoMatchingError"}]}},{"Identifier":"lex-input","Type":"ConnectParticipantWithLexBot","Parameters":{"LexV2Bot":{"AliasArn":"${ConnectChaosBotAlias.Arn}"}},"Transitions":{"NextAction":"success-path","Conditions":[{"NextAction":"success-path","Condition":{"Operator":"Equals","Operands":["LookupCustomer"]}},{"NextAction":"success-path","Condition":{"Operator":"Equals","Operands":["CheckOrderStatus"]}}],"Errors":[{"NextAction":"error-path","ErrorType":"NoMatchingError"},{"NextAction":"error-path","ErrorType":"NoMatchingCondition"}]}},{"Identifier":"success-path","Type":"MessageParticipant","Parameters":{"Text":"Found your info. Transferring to an agent."},"Transitions":{"NextAction":"disconnect","Errors":[{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"error-path","Type":"MessageParticipant","Parameters":{"Text":"Could not process your request. Please hold."},"Transitions":{"NextAction":"disconnect","Errors":[{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"disconnect","Type":"DisconnectParticipant","Parameters":{},"Transitions":{}}]}

  # ═══════════════════════════════════════════════════════════
  # BOTH REGIONS (deployed via StackSet)
  # ═══════════════════════════════════════════════════════════

  # ── S3 ──
  # Bucket name includes the StackName so re-deploys after delete don't conflict
  # with the S3 90-day name reservation window.
  FISConfigBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'connect-chaos-fis-${AWS::AccountId}-${AWS::Region}-${AWS::StackName}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── IAM ──
  LexBotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ConnectChaos-LexBot-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lexv2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Polly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: '*'

  LexFulfillmentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ConnectChaos-LexFulfillment-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DynamoDB
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ConnectChaosCustomers'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ConnectChaosConfig'
        - PolicyName: FISConfigRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FISConfigBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: ['FisConfigs/*']
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${FISConfigBucket.Arn}/FisConfigs/*'

  FISExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ConnectChaos-FIS-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: fis.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt LexFulfillmentHandler.Arn
              - Effect: Allow
                Action: tag:GetResources
                Resource: '*'
        - PolicyName: S3Write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${FISConfigBucket.Arn}/FisConfigs/*'
        - PolicyName: Network
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkAcl
                  - ec2:CreateNetworkAclEntry
                  - ec2:DeleteNetworkAcl
                  - ec2:DeleteNetworkAclEntry
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:ReplaceNetworkAclAssociation
                  - ec2:CreateTags
                Resource: '*'
        - PolicyName: CloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: '*'

  TrafficShiftRole:
    Type: AWS::IAM::Role
    Condition: DeployAutoFailover
    Properties:
      RoleName: !Sub 'ConnectChaos-TrafficShift-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Connect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - connect:UpdateTrafficDistribution
                  - connect:GetTrafficDistribution
                  - connect:DescribeTrafficDistributionGroup
                Resource: !Sub 'arn:aws:connect:${AWS::Region}:${AWS::AccountId}:traffic-distribution-group/*'

  # ── Lex V2 Bot ──
  # When EnableLexGlobalResiliency=true (default): bot is created in PRIMARY only and
  # replicated to PAIRED via Lex GR — preserving bot ID and alias ARN cross-region so
  # the contact flow's hardcoded Lex alias ARN remains valid after ACGR replicates the
  # contact flow content.
  # When false: bot is created independently per region.
  ConnectChaosBot:
    Type: AWS::Lex::Bot
    Condition: CreateLexLocally
    Properties:
      Name: ConnectChaosBot
      Description: IVR bot for FIS chaos engineering sample
      RoleArn: !GetAtt LexBotRole.Arn
      DataPrivacy:
        # ChildDirected MUST be true if your contact center serves users under 13 (COPPA).
        # This sample is configured for general adult customer-service use; flip this if
        # your deployment targets minors.
        ChildDirected: false
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      # Lex Global Resiliency replication block — declared on the source (primary) bot.
      # When EnableLexGlobalResiliency=true and we're in the primary region, this triggers
      # Lex to replicate the bot, all versions, and all aliases to ReplicaRegion. Replicas
      # preserve the same bot ID and alias ARN, so downstream Connect contact flows can
      # reference a single ARN that resolves correctly in either region after ACGR replicates
      # the contact flow content.
      # Ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-lex-bot-replication.html
      Replication: !If
        - UseLexGRPrimary
        - ReplicaRegions:
            - !Ref PairedRegion
        - !Ref AWS::NoValue
      BotLocales:
        - LocaleId: en_US
          NluConfidenceThreshold: 0.40
          Intents:
            - Name: LookupCustomer
              Description: Look up customer by account number
              SampleUtterances:
                - Utterance: I want to look up my account
                - Utterance: check my account
                - Utterance: my account number is {AccountNumber}
                - Utterance: look up account {AccountNumber}
              Slots:
                - Name: AccountNumber
                  SlotTypeName: AMAZON.Number
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: What is your account number?
                      MaxRetries: 2
              FulfillmentCodeHook:
                Enabled: true
            - Name: CheckOrderStatus
              Description: Check order status
              SampleUtterances:
                - Utterance: check my order
                - Utterance: where is my order {OrderId}
                - Utterance: order status for {OrderId}
              Slots:
                - Name: OrderId
                  SlotTypeName: AMAZON.AlphaNumeric
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: What is your order ID?
                      MaxRetries: 2
              FulfillmentCodeHook:
                Enabled: true
            - Name: FallbackIntent
              Description: Default fallback
              ParentIntentSignature: AMAZON.FallbackIntent

  ConnectChaosBotVersion:
    Type: AWS::Lex::BotVersion
    Condition: CreateLexLocally
    Properties:
      BotId: !GetAtt ConnectChaosBot.Id
      BotVersionLocaleSpecification:
        - LocaleId: en_US
          BotVersionLocaleDetails:
            SourceBotVersion: DRAFT

  ConnectChaosBotAlias:
    Type: AWS::Lex::BotAlias
    Condition: CreateLexLocally
    Properties:
      BotId: !GetAtt ConnectChaosBot.Id
      BotAliasName: live
      BotVersion: !GetAtt ConnectChaosBotVersion.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: en_US
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                CodeHookInterfaceVersion: '1.0'
                LambdaArn: !GetAtt LexFulfillmentHandler.Arn

  # ── Lambda ──
  LexFulfillmentHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LexFulfillmentHandler
      # Note: python3.12 reaches Lambda EoL in late 2027. Bump to the latest supported
      # runtime (python3.13+) when you next update this sample. See:
      # https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
      Runtime: python3.12
      Handler: lex_fulfillment_handler.lambda_handler
      Role: !GetAtt LexFulfillmentRole.Arn
      Timeout: 8
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: connect-chaos/lex_fulfillment_handler.zip
      Layers:
        - !Ref FISExtensionLayerArn
      Environment:
        Variables:
          CUSTOMER_TABLE_NAME: ConnectChaosCustomers
          CHAOS_TABLE_NAME: ConnectChaosConfig
          AWS_FIS_CONFIGURATION_LOCATION: !Sub '${FISConfigBucket.Arn}/FisConfigs/'
          AWS_LAMBDA_EXEC_WRAPPER: /opt/aws-fis/bootstrap
      VpcConfig:
        SubnetIds:
          - !Ref LambdaSubnetIdA
          - !Ref LambdaSubnetIdB
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Tags:
        - Key: FISExperiment
          Value: ConnectChaos

  # Lex V2 → Lambda invocation permission (FulfillmentCodeHook).
  # The Lambda is invoked by Lex (acting as the code hook), not by Connect directly.
  # Connect calls Lex; Lex calls Lambda; Lambda returns to Lex; Lex returns to Connect.
  LexLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LexFulfillmentHandler
      Action: lambda:InvokeFunction
      Principal: lexv2.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'

  TrafficShiftHandler:
    Type: AWS::Lambda::Function
    Condition: DeployAutoFailover
    Properties:
      FunctionName: ConnectChaos-TrafficShiftHandler
      Runtime: python3.12
      Handler: traffic_shift_handler.lambda_handler
      Role: !GetAtt TrafficShiftRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: connect-chaos/traffic_shift_handler.zip
      Environment:
        Variables:
          TRAFFIC_DISTRIBUTION_GROUP_ID: !Ref TrafficDistributionGroupId
          MY_REGION: !Ref 'AWS::Region'
          PRIMARY_REGION: !Ref PrimaryRegion
          PAIRED_REGION: !Ref PairedRegion

  # ── CloudWatch Alarms ──
  AlarmLambdaErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-Lambda-Errors-${AWS::Region}'
      AlarmDescription: 'Exp 1: Lambda invocation errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LexFulfillmentHandler
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmContactFlowErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-ContactFlow-Errors-${AWS::Region}'
      AlarmDescription: 'Exp 2: ContactFlowErrors from DDB disruption (sums across both workshop flows)'
      Metrics:
        # Connect publishes ContactFlowErrors with dimensions [InstanceId, MetricGroup, ContactFlowName].
        # An alarm without ContactFlowName matches no datapoints, so we sum across our two
        # known-named flows using a metric math expression.
        - Id: m1
          MetricStat:
            Metric:
              Namespace: AWS/Connect
              MetricName: ContactFlowErrors
              Dimensions:
                - Name: InstanceId
                  Value: !Ref ConnectInstanceId
                - Name: MetricGroup
                  Value: ContactFlow
                - Name: ContactFlowName
                  Value: ConnectChaos-MainIVR
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m2
          MetricStat:
            Metric:
              Namespace: AWS/Connect
              MetricName: ContactFlowErrors
              Dimensions:
                - Name: InstanceId
                  Value: !Ref ConnectInstanceId
                - Name: MetricGroup
                  Value: ContactFlow
                - Name: ContactFlowName
                  Value: ConnectChaos-ChaosTest
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: total
          Expression: 'SUM([m1, m2])'
          Label: TotalContactFlowErrors
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: !Ref ContactFlowErrorsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmLexRuntimeErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-Lex-RuntimeLambdaErrors-${AWS::Region}'
      AlarmDescription: 'Exp 3: Lex code hook timeout (sums across RecognizeUtterance/RecognizeText)'
      Metrics:
        # Lex V2 emits RuntimeLambdaErrors per Operation. Connect voice traffic invokes the
        # bot via RecognizeUtterance (streaming speech). Connect chat traffic invokes via
        # RecognizeText. We sum both so the alarm fires regardless of channel.
        - Id: utter
          MetricStat:
            Metric:
              Namespace: AWS/Lex
              MetricName: RuntimeLambdaErrors
              Dimensions:
                - Name: BotId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
                - Name: BotAliasId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]
                - Name: Operation
                  Value: RecognizeUtterance
                - Name: InputMode
                  Value: Speech
                - Name: LocaleId
                  Value: en_US
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: txt
          MetricStat:
            Metric:
              Namespace: AWS/Lex
              MetricName: RuntimeLambdaErrors
              Dimensions:
                - Name: BotId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
                - Name: BotAliasId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]
                - Name: Operation
                  Value: RecognizeText
                - Name: InputMode
                  Value: Text
                - Name: LocaleId
                  Value: en_US
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: total
          Expression: 'SUM([utter, txt])'
          Label: TotalRuntimeLambdaErrors
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: !Ref RuntimeLambdaErrorsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmMissedCalls:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-MissedCalls-${AWS::Region}'
      AlarmDescription: 'Exp 4: MissedCalls from chaos flag'
      Namespace: AWS/Connect
      MetricName: MissedCalls
      Dimensions:
        - Name: InstanceId
          Value: !Ref ConnectInstanceId
        - Name: MetricGroup
          Value: VoiceCalls
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: !Ref MissedCallsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  CompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-Composite-${AWS::Region}'
      AlarmDescription: ANY component alarm triggers ACGR failover
      AlarmRule: !Sub 'ALARM("ConnectChaos-Lambda-Errors-${AWS::Region}") OR ALARM("ConnectChaos-ContactFlow-Errors-${AWS::Region}") OR ALARM("ConnectChaos-Lex-RuntimeLambdaErrors-${AWS::Region}") OR ALARM("ConnectChaos-MissedCalls-${AWS::Region}")'
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # SNS topic for human-in-the-loop alerts on composite alarm state changes.
  # Subscribers are added by the operator via the AWS Console after deploy
  # (we don't pre-subscribe an email because emails would need confirmation).
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'ConnectChaos-AlarmNotifications-${AWS::Region}'
      DisplayName: ConnectChaos alarm notifications

  # ── FIS Experiment Templates ──
  FISExperimentLambdaFailure:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: 'Exp 1: Lambda invocation failure'
      RoleArn: !GetAtt FISExecutionRole.Arn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !GetAtt AlarmLambdaErrors.Arn
      Targets:
        LambdaFunction:
          ResourceType: aws:lambda:function
          ResourceArns:
            - !GetAtt LexFulfillmentHandler.Arn
          SelectionMode: ALL
      Actions:
        InjectError:
          ActionId: aws:lambda:invocation-error
          Parameters:
            duration: !Ref FISExperimentDuration
            preventExecution: 'true'
          Targets:
            Functions: LambdaFunction
      Tags:
        Name: ConnectChaos-Exp1-LambdaFailure

  FISExperimentDDBDisruption:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: 'Exp 2: DynamoDB network disruption (targets ALL Lambda subnets for deterministic blast radius)'
      RoleArn: !GetAtt FISExecutionRole.Arn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !GetAtt AlarmContactFlowErrors.Arn
      Targets:
        Subnets:
          ResourceType: aws:ec2:subnet
          # Target every subnet the Lambda has an ENI in. If FIS only disrupts a subset,
          # invocations landing on the other ENI bypass the chaos non-deterministically.
          ResourceArns: !Split
            - ','
            - !Join
              - ','
              - - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${LambdaSubnetIdA}'
                - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${LambdaSubnetIdB}'
          SelectionMode: ALL
      Actions:
        DisruptDDB:
          ActionId: aws:network:disrupt-connectivity
          Parameters:
            duration: !Ref FISExperimentDuration
            scope: dynamodb
          Targets:
            Subnets: Subnets
      Tags:
        Name: ConnectChaos-Exp2-DDBDisruption

  FISExperimentLexTimeout:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: 'Exp 3: Lambda delay causing Lex code hook timeout'
      RoleArn: !GetAtt FISExecutionRole.Arn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !GetAtt AlarmLexRuntimeErrors.Arn
      Targets:
        LambdaFunction:
          ResourceType: aws:lambda:function
          ResourceArns:
            - !GetAtt LexFulfillmentHandler.Arn
          SelectionMode: ALL
      Actions:
        InjectDelay:
          ActionId: aws:lambda:invocation-add-delay
          Parameters:
            duration: !Ref FISExperimentDuration
            invocationPercentage: '100'
            startupDelayMilliseconds: '15000'
          Targets:
            Functions: LambdaFunction
      Tags:
        Name: ConnectChaos-Exp3-LexTimeout

  # ── EventBridge (both regions — either can failover) ──
  FailoverEventRule:
    Type: AWS::Events::Rule
    Condition: DeployAutoFailover
    Properties:
      Name: !Sub 'ConnectChaos-Failover-${AWS::Region}'
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: ['CloudWatch Alarm State Change']
        detail:
          alarmName: [!Sub 'ConnectChaos-Composite-${AWS::Region}']
          state:
            value: [ALARM]
      Targets:
        - Id: TrafficShift
          Arn: !GetAtt TrafficShiftHandler.Arn

  FailoverEventPermission:
    Type: AWS::Lambda::Permission
    Condition: DeployAutoFailover
    Properties:
      FunctionName: !Ref TrafficShiftHandler
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FailoverEventRule.Arn

  # ── Dashboards ──
  RegionalDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: DeployRegionalDashboard
    Properties:
      DashboardName: !Sub 'ConnectChaos-${AWS::Region}'
      DashboardBody: !Sub
        - |
          {"widgets":[{"type":"metric","width":6,"height":6,"x":0,"y":0,"properties":{"title":"Exp 1: Lambda Errors","metrics":[["AWS/Lambda","Errors","FunctionName","LexFulfillmentHandler",{"stat":"Sum"}]],"period":60,"region":"${AWS::Region}"}},{"type":"metric","width":6,"height":6,"x":6,"y":0,"properties":{"title":"Exp 2: ContactFlowErrors","metrics":[["AWS/Connect","ContactFlowErrors","InstanceId","${ConnectInstanceId}","MetricGroup","ContactFlow","ContactFlowName","ConnectChaos-MainIVR",{"stat":"Sum"}],["...","ConnectChaos-ChaosTest"]],"period":60,"region":"${AWS::Region}"}},{"type":"metric","width":6,"height":6,"x":12,"y":0,"properties":{"title":"Exp 3: Lex RuntimeLambdaErrors","metrics":[["AWS/Lex","RuntimeLambdaErrors","BotId","${BotId}","BotAliasId","${BotAliasId}","Operation","RecognizeUtterance","InputMode","Speech","LocaleId","en_US",{"stat":"Sum"}]],"period":60,"region":"${AWS::Region}"}},{"type":"metric","width":6,"height":6,"x":0,"y":6,"properties":{"title":"Exp 4: MissedCalls","metrics":[["AWS/Connect","MissedCalls","InstanceId","${ConnectInstanceId}","MetricGroup","VoiceCalls",{"stat":"Sum"}]],"period":300,"region":"${AWS::Region}"}}]}
        - BotId: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
          BotAliasId: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]

  UnifiedDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: DeployUnifiedDashboard
    Properties:
      DashboardName: ConnectChaos-Unified
      DashboardBody: !Sub
        - |
          {"widgets":[{"type":"text","width":24,"height":1,"x":0,"y":0,"properties":{"markdown":"## Primary Region (${PrimaryRegion})"}},{"type":"metric","width":6,"height":5,"x":0,"y":1,"properties":{"title":"Lambda Errors","metrics":[["AWS/Lambda","Errors","FunctionName","LexFulfillmentHandler",{"stat":"Sum","region":"${PrimaryRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":6,"y":1,"properties":{"title":"ContactFlowErrors","metrics":[["AWS/Connect","ContactFlowErrors","InstanceId","${ConnectInstanceId}","MetricGroup","ContactFlow","ContactFlowName","ConnectChaos-MainIVR",{"stat":"Sum","region":"${PrimaryRegion}"}],["...","ConnectChaos-ChaosTest"]],"period":60}},{"type":"metric","width":6,"height":5,"x":12,"y":1,"properties":{"title":"Lex RuntimeLambdaErrors","metrics":[["AWS/Lex","RuntimeLambdaErrors","BotId","${BotId}","BotAliasId","${BotAliasId}","Operation","RecognizeUtterance","InputMode","Speech","LocaleId","en_US",{"stat":"Sum","region":"${PrimaryRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":18,"y":1,"properties":{"title":"MissedCalls","metrics":[["AWS/Connect","MissedCalls","InstanceId","${ConnectInstanceId}","MetricGroup","VoiceCalls",{"stat":"Sum","region":"${PrimaryRegion}"}]],"period":300}},{"type":"text","width":24,"height":1,"x":0,"y":6,"properties":{"markdown":"## Paired Region (${PairedRegion})"}},{"type":"metric","width":6,"height":5,"x":0,"y":7,"properties":{"title":"Lambda Errors","metrics":[["AWS/Lambda","Errors","FunctionName","LexFulfillmentHandler",{"stat":"Sum","region":"${PairedRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":6,"y":7,"properties":{"title":"ContactFlowErrors","metrics":[["AWS/Connect","ContactFlowErrors","InstanceId","${PairedInstanceIdEffective}","MetricGroup","ContactFlow","ContactFlowName","ConnectChaos-MainIVR",{"stat":"Sum","region":"${PairedRegion}"}],["...","ConnectChaos-ChaosTest"]],"period":60}},{"type":"metric","width":6,"height":5,"x":12,"y":7,"properties":{"title":"Lex RuntimeLambdaErrors","metrics":[["AWS/Lex","RuntimeLambdaErrors","BotId","${BotId}","BotAliasId","${BotAliasId}","Operation","RecognizeUtterance","InputMode","Speech","LocaleId","en_US",{"stat":"Sum","region":"${PairedRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":18,"y":7,"properties":{"title":"MissedCalls","metrics":[["AWS/Connect","MissedCalls","InstanceId","${PairedInstanceIdEffective}","MetricGroup","VoiceCalls",{"stat":"Sum","region":"${PairedRegion}"}]],"period":300}}]}
        - BotId: !GetAtt ConnectChaosBot.Id
          BotAliasId: !GetAtt ConnectChaosBotAlias.BotAliasId
          PairedInstanceIdEffective: !Ref PairedConnectInstanceId

  # ═══════════════════════════════════════════════════════════════
  # OPTIONAL: Synthetic Traffic Generator
  # ═══════════════════════════════════════════════════════════════

  TrafficGeneratorRole:
    Type: AWS::IAM::Role
    Condition: DeployTrafficGenerator
    Properties:
      RoleName: !Sub 'ConnectChaos-TrafficGenerator-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchPutMetric
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace:
                      - AWS/Lambda
                      - AWS/Connect
                      - AWS/Lex

  TrafficGeneratorFunction:
    Type: AWS::Lambda::Function
    Condition: DeployTrafficGenerator
    Properties:
      FunctionName: !Sub 'ConnectChaos-TrafficGenerator-${AWS::Region}'
      Runtime: python3.12
      Handler: traffic_generator.handler
      Role: !GetAtt TrafficGeneratorRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: connect-chaos/traffic_generator.zip
      Environment:
        Variables:
          CONNECT_INSTANCE_ID: !Ref ConnectInstanceId
          LEX_BOT_ID: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
          LEX_BOT_ALIAS_ID: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]
          LAMBDA_FUNCTION_NAME: !Ref LexFulfillmentHandler
          MODE: healthy
          CALLS_PER_MINUTE: '10'

  TrafficGeneratorSchedule:
    Type: AWS::Events::Rule
    Condition: DeployTrafficGenerator
    Properties:
      Name: !Sub 'ConnectChaos-TrafficGen-Schedule-${AWS::Region}'
      Description: Generate synthetic baseline traffic every minute
      ScheduleExpression: 'rate(1 minute)'
      State: DISABLED
      Targets:
        - Id: TrafficGen
          Arn: !GetAtt TrafficGeneratorFunction.Arn

  TrafficGeneratorSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: DeployTrafficGenerator
    Properties:
      FunctionName: !Ref TrafficGeneratorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TrafficGeneratorSchedule.Arn

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════
Outputs:
  LexBotId:
    Condition: CreateLexLocally
    Value: !GetAtt ConnectChaosBot.Id
    Description: Lex V2 Bot ID. With Lex GR enabled this same ID exists in the paired region.
  LexBotAliasId:
    Condition: CreateLexLocally
    Value: !GetAtt ConnectChaosBotAlias.BotAliasId
    Description: Lex V2 Bot Alias ID. With Lex GR enabled this same ID exists in the paired region.
  LexBotAliasArn:
    Condition: CreateLexLocally
    Value: !GetAtt ConnectChaosBotAlias.Arn
    Description: Lex V2 Bot Alias ARN. With Lex GR enabled this same ARN is valid in the paired region.
  LambdaArn:
    Value: !GetAtt LexFulfillmentHandler.Arn
  FISExperiment1:
    Value: !Ref FISExperimentLambdaFailure
    Description: Lambda Failure
  FISExperiment2:
    Value: !Ref FISExperimentDDBDisruption
    Description: DDB Disruption
  FISExperiment3:
    Value: !Ref FISExperimentLexTimeout
    Description: Lex Timeout
  CompositeAlarmArn:
    Value: !GetAtt CompositeAlarm.Arn
  Region:
    Value: !Ref 'AWS::Region'
  TrafficGeneratorArn:
    Condition: DeployTrafficGenerator
    Value: !GetAtt TrafficGeneratorFunction.Arn
    Description: Synthetic traffic generator Lambda ARN
