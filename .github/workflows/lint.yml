name: Lint and validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install cfn-lint==1.* pyyaml

      - name: cfn-lint on CloudFormation template
        # W1030 is expected: ReplicatedLexBot* params are intentionally empty
        # in primary-region deploys and only populated in paired-region.
        run: cfn-lint -i W1030 -- cfn/main-template.yaml

      - name: Bash syntax check on helper scripts
        run: |
          shopt -s nullglob
          for f in scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done

      - name: Python compile check on Lambda functions
        run: |
          python -c "
          import py_compile, glob, sys
          for f in sorted(glob.glob('lambda/*.py')):
              print(f'Compiling {f}')
              py_compile.compile(f, doraise=True)
          print('All Lambda Python files compile cleanly.')
          "

      - name: Validate contact flow JSON references
        run: |
          python -c "
          import json, glob, sys
          for f in sorted(glob.glob('contact-flows/*.json')):
              print(f'Parsing {f}')
              with open(f) as fp:
                  json.load(fp)
          print('All contact flow JSON files parse cleanly.')
          "

  cfn-validate:
    runs-on: ubuntu-latest
    # Server-side CFN parse using public endpoint (no AWS credentials needed
    # for static template validation when using --no-sign-request friendly
    # approach is unavailable; we use cfn-flip + cfn-lint instead).
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-flip for YAML/JSON conversion sanity check
        run: pip install cfn-flip

      - name: Round-trip CFN template (catches malformed YAML/JSON)
        run: |
          cfn-flip cfn/main-template.yaml /tmp/template.json
          cfn-flip /tmp/template.json /tmp/template-roundtrip.yaml
          echo "Template round-trips successfully."
