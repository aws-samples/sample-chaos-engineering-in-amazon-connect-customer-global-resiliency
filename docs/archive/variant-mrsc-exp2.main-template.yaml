AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Amazon Connect FIS Chaos Engineering — ACGR Failover (StackSet-Ready)
  Deploy via StackSet to both primary and paired regions.
  Uses IsPrimaryRegion condition to control region-specific resources.

# ═══════════════════════════════════════════════════════════════
# PARAMETERS
# ═══════════════════════════════════════════════════════════════
Parameters:

  ConnectInstanceArn:
    Type: String
    Description: ARN of the Connect instance in THIS region
    AllowedPattern: 'arn:aws:connect:[a-z0-9-]+:[0-9]+:instance/[a-z0-9-]+'

  ConnectInstanceId:
    Type: String
    Description: Connect Instance ID (UUID) for THIS region

  PrimaryRegion:
    Type: String
    Description: Primary ACGR region
    Default: us-east-1
    AllowedValues: [us-east-1, us-west-2, ap-northeast-1, ap-northeast-3, eu-central-1, eu-west-2]

  PairedRegion:
    Type: String
    Description: Paired ACGR region
    Default: us-west-2
    AllowedValues: [us-east-1, us-west-2, ap-northeast-1, ap-northeast-3, eu-central-1, eu-west-2]

  WitnessRegion:
    Type: String
    Description: >-
      Third Region used as the DynamoDB MRSC *witness* for the ConnectChaosCustomers global
      table (Experiment 2). A MRSC global table must span exactly three Regions — here two
      replicas (primary + paired) plus one witness. The witness holds no readable data and
      is fully managed by DynamoDB; it does not appear in your account. It MUST be in the
      same MRSC Region set as the replica pair:
        • US set  (us-east-1, us-east-2, us-west-2)                  -> witness us-east-2
        • EU set  (eu-west-1, eu-west-2, eu-west-3, eu-central-1)    -> witness eu-west-1 or eu-west-3
        • AP set  (ap-northeast-1, ap-northeast-2, ap-northeast-3)   -> witness ap-northeast-2
      Ref: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
    Default: us-east-2
    AllowedValues: [us-east-2, eu-west-1, eu-west-3, ap-northeast-2]
  TrafficDistributionGroupId:
    Type: String
    Description: Traffic Distribution Group ID for ACGR failover

  EnableAutoFailover:
    Type: String
    Description: Deploy EventBridge + TrafficShift Lambda for automatic failover
    AllowedValues: ['true', 'false']
    Default: 'false'

  DashboardType:
    Type: String
    Description: 'regional = per-region dashboard; unified = single cross-region dashboard in primary'
    AllowedValues: ['regional', 'unified']
    Default: regional

  LambdaSubnetIdA:
    Type: AWS::EC2::Subnet::Id
    Description: First VPC subnet for Lambda (also targeted by FIS Experiment 2 DDB disruption)

  LambdaSubnetIdB:
    Type: AWS::EC2::Subnet::Id
    Description: Second VPC subnet for Lambda (also targeted by FIS Experiment 2 DDB disruption)

  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group for Lambda VPC config

  LambdaCodeBucket:
    Type: String
    Description: Pre-existing S3 bucket with Lambda .zip packages

  FISExtensionLayerArn:
    Type: String
    Description: AWS FIS Lambda extension layer ARN for this region

  ContactFlowErrorsThreshold:
    Type: Number
    Default: 5

  DDBFaultErrorsThreshold:
    Type: Number
    Default: 3
    Description: >-
      Exp 2 alarm threshold — FIS-induced DynamoDB errors per minute on the MRSC global table.

  RuntimeLambdaErrorsThreshold:
    Type: Number
    Default: 3

  QueueWaitSecondsThreshold:
    Type: Number
    Default: 60
    Description: >-
      Exp 4 alarm threshold (seconds). Fires when a contact waits longer than this in the
      no-agent overflow queue (LongestQueueWaitTime).

  FISExperimentDuration:
    Type: String
    Default: PT5M

  EnableTrafficGenerator:
    Type: String
    Description: Deploy optional synthetic traffic generator Lambda (for testing alarms without real calls)
    AllowedValues: ['true', 'false']
    Default: 'false'

  EnableLexGlobalResiliency:
    Type: String
    Description: >-
      Use Amazon Lex Global Resiliency to replicate the Lex V2 bot from primary to paired.
      Strongly recommended (default 'true') because Lex GR preserves bot ID and alias ARN
      across regions — so the contact flow's hardcoded Lex alias ARN remains valid after
      ACGR replicates the flow to the paired region. Set to 'false' only if Lex GR is not
      available for your account; you must then run the post-deploy script in
      scripts/wire-paired-flow.sh to rewrite the paired-region flow content.
    AllowedValues: ['true', 'false']
    Default: 'true'

  ReplicatedLexBotId:
    Type: String
    Description: >-
      (Paired region only, when EnableLexGlobalResiliency=true.) The Lex bot ID emitted
      by the primary-region stack output `LexBotId`. Lex GR preserves the same ID in the
      paired region. Pass empty string ("") in primary region.
    Default: ''

  ReplicatedLexBotAliasId:
    Type: String
    Description: >-
      (Paired region only, when EnableLexGlobalResiliency=true.) The Lex bot alias ID
      emitted by the primary-region stack output `LexBotAliasId`.
      Pass empty string ("") in primary region.
    Default: ''

  PairedConnectInstanceId:
    Type: String
    Description: >-
      (Primary region only, when DashboardType=unified.) The paired-region Connect
      instance ID. Used to render the paired-region panels of the unified dashboard.
      Pass empty string ("") in paired region or when DashboardType=regional.
    Default: ''


# ═══════════════════════════════════════════════════════════════
# RULES — enforce ACGR-supported region pair before any resource is created
# ═══════════════════════════════════════════════════════════════
# Ref: https://docs.aws.amazon.com/connect/latest/adminguide/create-replica-connect-instance.html
#   • us-east-1 ↔ us-west-2
#   • eu-west-2 ↔ eu-central-1
#   • ap-northeast-1 ↔ ap-northeast-3   (one-directional: replica must be ap-northeast-3)
Rules:
  ValidACGRPair:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref PrimaryRegion, us-east-1]
            - !Equals [!Ref PairedRegion, us-west-2]
          - !And
            - !Equals [!Ref PrimaryRegion, us-west-2]
            - !Equals [!Ref PairedRegion, us-east-1]
          - !And
            - !Equals [!Ref PrimaryRegion, eu-west-2]
            - !Equals [!Ref PairedRegion, eu-central-1]
          - !And
            - !Equals [!Ref PrimaryRegion, eu-central-1]
            - !Equals [!Ref PairedRegion, eu-west-2]
          - !And
            - !Equals [!Ref PrimaryRegion, ap-northeast-1]
            - !Equals [!Ref PairedRegion, ap-northeast-3]
        AssertDescription: >-
          PrimaryRegion + PairedRegion must form an ACGR-supported pair:
          us-east-1/us-west-2, eu-west-2/eu-central-1, or ap-northeast-1/ap-northeast-3.

  # A DynamoDB MRSC global table must span exactly three Regions within ONE MRSC Region set.
  # The replica pair is PrimaryRegion + PairedRegion, so the witness must be the remaining
  # in-set Region. Enforced here so a mismatched witness fails at validation rather than
  # part-way through global table creation.
  ValidMRSCWitness:
    Assertions:
      - Assert: !Or
          # US set: replicas IAD + PDX -> witness must be CMH (us-east-2)
          - !And
            - !Or
              - !Equals [!Ref PrimaryRegion, us-east-1]
              - !Equals [!Ref PrimaryRegion, us-west-2]
            - !Equals [!Ref WitnessRegion, us-east-2]
          # EU set: replicas LHR + FRA -> witness must be DUB (eu-west-1) or CDG (eu-west-3)
          - !And
            - !Or
              - !Equals [!Ref PrimaryRegion, eu-west-2]
              - !Equals [!Ref PrimaryRegion, eu-central-1]
            - !Or
              - !Equals [!Ref WitnessRegion, eu-west-1]
              - !Equals [!Ref WitnessRegion, eu-west-3]
          # AP set: replicas NRT + KIX -> witness must be ICN (ap-northeast-2)
          - !And
            - !Or
              - !Equals [!Ref PrimaryRegion, ap-northeast-1]
              - !Equals [!Ref PrimaryRegion, ap-northeast-3]
            - !Equals [!Ref WitnessRegion, ap-northeast-2]
        AssertDescription: >-
          WitnessRegion must be in the same DynamoDB MRSC Region set as PrimaryRegion/PairedRegion:
          us-east-1|us-west-2 -> us-east-2; eu-west-2|eu-central-1 -> eu-west-1 or eu-west-3;
          ap-northeast-1|ap-northeast-3 -> ap-northeast-2.

  # Lex Global Resiliency currently supports IAD/PDX and LDN/FRA only.
  # Tokyo/Osaka customers must run with EnableLexGlobalResiliency=false (per-region Lex deploy)
  # and use the post-deploy script to wire the paired-region contact flow.
  LexGRPairAvailable:
    RuleCondition: !Equals [!Ref EnableLexGlobalResiliency, 'true']
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref PrimaryRegion, us-east-1]
            - !Equals [!Ref PairedRegion, us-west-2]
          - !And
            - !Equals [!Ref PrimaryRegion, us-west-2]
            - !Equals [!Ref PairedRegion, us-east-1]
          - !And
            - !Equals [!Ref PrimaryRegion, eu-west-2]
            - !Equals [!Ref PairedRegion, eu-central-1]
          - !And
            - !Equals [!Ref PrimaryRegion, eu-central-1]
            - !Equals [!Ref PairedRegion, eu-west-2]
        AssertDescription: >-
          Lex Global Resiliency currently supports only us-east-1/us-west-2 and
          eu-west-2/eu-central-1 region pairs. For ap-northeast-1/ap-northeast-3,
          set EnableLexGlobalResiliency=false and run scripts/wire-paired-flow.sh
          after deploy to wire the paired-region contact flow to its independent Lex bot.

# ═══════════════════════════════════════════════════════════════
# CONDITIONS
# ═══════════════════════════════════════════════════════════════
Conditions:
  IsPrimaryRegion: !Equals [!Ref 'AWS::Region', !Ref PrimaryRegion]
  DeployAutoFailover: !Equals [!Ref EnableAutoFailover, 'true']
  DeployRegionalDashboard: !Equals [!Ref DashboardType, 'regional']
  DeployUnifiedDashboard: !And
    - !Equals [!Ref DashboardType, 'unified']
    - !Condition IsPrimaryRegion
  DeployTrafficGenerator: !Equals [!Ref EnableTrafficGenerator, 'true']
  UseLexGR: !Equals [!Ref EnableLexGlobalResiliency, 'true']

  # Source-side Lex GR replication is declared on the bot in the primary region only.
  UseLexGRPrimary: !And
    - !Condition UseLexGR
    - !Condition IsPrimaryRegion

  # When Lex GR is on, the Lex bot is created ONLY in the primary region; Lex GR replicates
  # it to the paired region. When Lex GR is off, the bot is created independently per region.
  CreateLexLocally: !Or
    - !Condition IsPrimaryRegion
    - !Not [!Condition UseLexGR]

# ═══════════════════════════════════════════════════════════════
# RESOURCES
# ═══════════════════════════════════════════════════════════════
Resources:

  # ═══════════════════════════════════════════════════════════
  # PRIMARY REGION ONLY
  # ═══════════════════════════════════════════════════════════

  # ── Exp 2 target: MRSC (multi-Region STRONG consistency) global table ──
  # Why MRSC: the FIS action aws:dynamodb:global-table-pause-replication simulates Region
  # isolation. On an MREC (eventually consistent) table that only stalls replication and is
  # invisible to the application. On an MRSC table, writes and STRONGLY CONSISTENT reads in
  # the isolated Region fail with FIS-injected HTTP 500s, which DynamoDB publishes as
  # FaultInjectionServiceInducedErrors (a labelled subset of SystemErrors). That gives
  # Experiment 2 a real, application-visible DynamoDB failure and an AWS/DynamoDB metric
  # that unambiguously attributes the fault to DynamoDB.
  #
  # MRSC requires EXACTLY three Regions in one Region set: two replicas + one witness.
  # A witness stores data for quorum but is not readable/writable and is managed by
  # DynamoDB (it does not appear in your account).
  #
  # NOTE: MRSC tables must be created empty and replicas cannot be added later — this is a
  # create-time topology choice, not an in-place conversion.
  # Streams are not required for MRSC, so StreamSpecification is intentionally omitted.
  # Ref: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html
  CustomerTable:
    Type: AWS::DynamoDB::GlobalTable
    Condition: IsPrimaryRegion
    Properties:
      TableName: ConnectChaosCustomers
      BillingMode: PAY_PER_REQUEST
      MultiRegionConsistency: STRONG
      AttributeDefinitions:
        - AttributeName: account_id
          AttributeType: S
      KeySchema:
        - AttributeName: account_id
          KeyType: HASH
      Replicas:
        - Region: !Ref PrimaryRegion
          Tags:
            - Key: FISExperiment
              Value: ConnectChaos
            # Tag recognised by the AWS-managed FIS "Cross-Region: Connectivity" scenario,
            # which also pauses DynamoDB replication. Harmless for our own template.
            - Key: DisruptDynamoDb
              Value: Allowed
        - Region: !Ref PairedRegion
          Tags:
            - Key: FISExperiment
              Value: ConnectChaos
            - Key: DisruptDynamoDb
              Value: Allowed
      GlobalTableWitnesses:
        - Region: !Ref WitnessRegion

  ChaosConfigTable:
    Type: AWS::DynamoDB::GlobalTable
    Condition: IsPrimaryRegion
    Properties:
      TableName: ConnectChaosConfig
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: config_key
          AttributeType: S
      KeySchema:
        - AttributeName: config_key
          KeyType: HASH
      Replicas:
        - Region: !Ref PrimaryRegion
          Tags:
            - Key: FISExperiment
              Value: ConnectChaos
        - Region: !Ref PairedRegion
          Tags:
            - Key: FISExperiment
              Value: ConnectChaos
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  MainIVRFlow:
    Type: AWS::Connect::ContactFlow
    Condition: IsPrimaryRegion
    # The bot must be associated with the instance before a flow may reference it.
    DependsOn: LexBotIntegrationAssociation
    Properties:
      InstanceArn: !Ref ConnectInstanceArn
      Name: ConnectChaos-MainIVR
      Type: CONTACT_FLOW
      Description: Main IVR with Lex bot — ACGR auto-replicates to paired region
      # The Lex alias ARN uses the ACGR runtime token $.AwsRegion instead of a hardcoded
      # Region. ACGR replicates this flow's content verbatim to the paired region, so a
      # hardcoded Region would make the paired region call the PRIMARY region's Lex bot —
      # defeating the failover. At flow runtime $.AwsRegion resolves to the Region the flow
      # is executing in. Lex GR preserves the bot ID and alias ID across Regions, so the
      # same ID pair is valid in both.
      # ACGR requirement: "Update your flows to replace any hardcoded Regions with a
      # $.AwsRegion parameter... supported only for Lambda ARN and Lex ARN."
      # Ref: https://docs.aws.amazon.com/connect/latest/adminguide/connect-global-resiliency-requirements.html
      # NOTE: when EnableLexGlobalResiliency=false the per-Region bot IDs differ, so
      # $.AwsRegion alone is not sufficient — run scripts/wire-paired-flow.sh after deploy.
      Content: !Sub
        - |
          {"Version":"2019-10-30","StartAction":"entry","Actions":[{"Identifier":"entry","Type":"MessageParticipant","Parameters":{"Text":"Welcome to customer service. I can help you look up your account or check an order."},"Transitions":{"NextAction":"lex-input","Errors":[{"NextAction":"error-msg","ErrorType":"NoMatchingError"}]}},{"Identifier":"lex-input","Type":"ConnectParticipantWithLexBot","Parameters":{"LexV2Bot":{"AliasArn":"arn:aws:lex:$.AwsRegion:${AWS::AccountId}:bot-alias/${BotId}/${BotAliasId}"}},"Transitions":{"NextAction":"success-msg","Conditions":[{"NextAction":"success-msg","Condition":{"Operator":"Equals","Operands":["LookupCustomer"]}},{"NextAction":"success-msg","Condition":{"Operator":"Equals","Operands":["CheckOrderStatus"]}}],"Errors":[{"NextAction":"error-msg","ErrorType":"NoMatchingError"},{"NextAction":"error-msg","ErrorType":"NoMatchingCondition"}]}},{"Identifier":"success-msg","Type":"MessageParticipant","Parameters":{"Text":"I found your information. Transferring to an agent."},"Transitions":{"NextAction":"disconnect","Errors":[{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"error-msg","Type":"MessageParticipant","Parameters":{"Text":"We are experiencing difficulties. Please try again later."},"Transitions":{"NextAction":"disconnect","Errors":[{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"disconnect","Type":"DisconnectParticipant","Parameters":{},"Transitions":{}}]}
        - BotId: !GetAtt ConnectChaosBot.Id
          BotAliasId: !GetAtt ConnectChaosBotAlias.BotAliasId

  ChaosTestFlow:
    Type: AWS::Connect::ContactFlow
    Condition: IsPrimaryRegion
    DependsOn: LexBotIntegrationAssociation
    Properties:
      InstanceArn: !Ref ConnectInstanceArn
      Name: ConnectChaos-ChaosTest
      Type: CONTACT_FLOW
      Description: >-
        Chaos test flow (Exp 4). On the failure path it sets the no-agent overflow queue
        and transfers the contact there, so unanswered contacts accumulate
        LongestQueueWaitTime — the Exp 4 alarm metric.
      # Lex alias ARN uses the ACGR $.AwsRegion runtime token — see MainIVRFlow above.
      # The queue reference stays a Connect-internal ARN: ACGR replicates the queue and
      # remaps flow queue references in the paired region, so no token is needed there.
      Content: !Sub
        - |
          {"Version":"2019-10-30","StartAction":"entry","Actions":[{"Identifier":"entry","Type":"MessageParticipant","Parameters":{"Text":"Welcome. Let me look up your information."},"Transitions":{"NextAction":"lex-input","Errors":[{"NextAction":"error-path","ErrorType":"NoMatchingError"}]}},{"Identifier":"lex-input","Type":"ConnectParticipantWithLexBot","Parameters":{"LexV2Bot":{"AliasArn":"arn:aws:lex:$.AwsRegion:${AWS::AccountId}:bot-alias/${BotId}/${BotAliasId}"}},"Transitions":{"NextAction":"success-path","Conditions":[{"NextAction":"success-path","Condition":{"Operator":"Equals","Operands":["LookupCustomer"]}},{"NextAction":"success-path","Condition":{"Operator":"Equals","Operands":["CheckOrderStatus"]}}],"Errors":[{"NextAction":"error-path","ErrorType":"NoMatchingError"},{"NextAction":"error-path","ErrorType":"NoMatchingCondition"}]}},{"Identifier":"success-path","Type":"MessageParticipant","Parameters":{"Text":"Found your info. Transferring to an agent."},"Transitions":{"NextAction":"disconnect","Errors":[{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"error-path","Type":"MessageParticipant","Parameters":{"Text":"We are experiencing technical difficulties. Please hold for the next available agent."},"Transitions":{"NextAction":"set-overflow-queue","Errors":[{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"set-overflow-queue","Type":"UpdateContactTargetQueue","Parameters":{"QueueId":"${ChaosOverflowQueue.QueueArn}"},"Transitions":{"NextAction":"transfer-overflow","Errors":[{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"transfer-overflow","Type":"TransferContactToQueue","Parameters":{},"Transitions":{"NextAction":"disconnect","Errors":[{"NextAction":"disconnect","ErrorType":"QueueAtCapacity"},{"NextAction":"disconnect","ErrorType":"NoMatchingError"}]}},{"Identifier":"disconnect","Type":"DisconnectParticipant","Parameters":{},"Transitions":{}}]}
        - BotId: !GetAtt ConnectChaosBot.Id
          BotAliasId: !GetAtt ConnectChaosBotAlias.BotAliasId

  # ── Exp 4: No-agent overflow queue ──
  # Hours of operation (24x7) is required by AWS::Connect::Queue. The queue has NO
  # routing profile pointing at it, so no agent can ever receive its contacts — a
  # contact transferred here waits indefinitely, driving LongestQueueWaitTime up.
  # ACGR replicates both resources (and remaps the flow's queue reference) to the
  # paired region, so no $.AwsRegion handling is needed for Connect-internal ARNs.
  ChaosHoursOfOperation:
    Type: AWS::Connect::HoursOfOperation
    Condition: IsPrimaryRegion
    Properties:
      InstanceArn: !Ref ConnectInstanceArn
      Name: ConnectChaos-24x7
      Description: 24x7 hours of operation for the chaos overflow queue
      TimeZone: UTC
      Config:
        - Day: MONDAY
          StartTime: {Hours: 0, Minutes: 0}
          EndTime: {Hours: 23, Minutes: 59}
        - Day: TUESDAY
          StartTime: {Hours: 0, Minutes: 0}
          EndTime: {Hours: 23, Minutes: 59}
        - Day: WEDNESDAY
          StartTime: {Hours: 0, Minutes: 0}
          EndTime: {Hours: 23, Minutes: 59}
        - Day: THURSDAY
          StartTime: {Hours: 0, Minutes: 0}
          EndTime: {Hours: 23, Minutes: 59}
        - Day: FRIDAY
          StartTime: {Hours: 0, Minutes: 0}
          EndTime: {Hours: 23, Minutes: 59}
        - Day: SATURDAY
          StartTime: {Hours: 0, Minutes: 0}
          EndTime: {Hours: 23, Minutes: 59}
        - Day: SUNDAY
          StartTime: {Hours: 0, Minutes: 0}
          EndTime: {Hours: 23, Minutes: 59}

  ChaosOverflowQueue:
    Type: AWS::Connect::Queue
    Condition: IsPrimaryRegion
    Properties:
      InstanceArn: !Ref ConnectInstanceArn
      Name: ConnectChaos-Overflow
      Description: No-agent overflow queue for Exp 4 (drives LongestQueueWaitTime)
      HoursOfOperationArn: !GetAtt ChaosHoursOfOperation.HoursOfOperationArn

  # ═══════════════════════════════════════════════════════════
  # BOTH REGIONS (deployed via StackSet)
  # ═══════════════════════════════════════════════════════════

  # ── S3 ──
  # Bucket name includes the StackName so re-deploys after delete don't conflict
  # with the S3 90-day name reservation window.
  FISConfigBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'connect-chaos-fis-${AWS::AccountId}-${AWS::Region}-${AWS::StackName}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ── IAM ──
  LexBotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ConnectChaos-LexBot-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lexv2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Polly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: '*'

  LexFulfillmentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ConnectChaos-LexFulfillment-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: DynamoDB
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ConnectChaosCustomers'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ConnectChaosConfig'
        - PolicyName: FISConfigRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt FISConfigBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: ['FisConfigs/*']
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${FISConfigBucket.Arn}/FisConfigs/*'

  FISExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'ConnectChaos-FIS-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: fis.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: Lambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt LexFulfillmentHandler.Arn
              - Effect: Allow
                Action: tag:GetResources
                Resource: '*'
        - PolicyName: S3Write
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${FISConfigBucket.Arn}/FisConfigs/*'
        - PolicyName: Network
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkAcl
                  - ec2:CreateNetworkAclEntry
                  - ec2:DeleteNetworkAcl
                  - ec2:DeleteNetworkAclEntry
                  - ec2:DescribeNetworkAcls
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:ReplaceNetworkAclAssociation
                  - ec2:CreateTags
                Resource: '*'
        - PolicyName: CloudWatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: '*'
        # Permissions required by aws:dynamodb:global-table-pause-replication.
        # FIS attaches a temporary resource policy to the target table for the duration of
        # the experiment and removes it afterwards. dynamodb:InjectError is required because
        # we target an MRSC global table.
        - PolicyName: DynamoDBPauseReplication
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutResourcePolicy
                  - dynamodb:DeleteResourcePolicy
                  - dynamodb:GetResourcePolicy
                  - dynamodb:DescribeTable
                  - dynamodb:InjectError
                Resource: !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ConnectChaosCustomers'

  TrafficShiftRole:
    Type: AWS::IAM::Role
    Condition: DeployAutoFailover
    Properties:
      RoleName: !Sub 'ConnectChaos-TrafficShift-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: Connect
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - connect:UpdateTrafficDistribution
                  - connect:GetTrafficDistribution
                  - connect:DescribeTrafficDistributionGroup
                Resource: !Sub 'arn:aws:connect:${AWS::Region}:${AWS::AccountId}:traffic-distribution-group/*'

  # ── Lex V2 Bot ──
  # When EnableLexGlobalResiliency=true (default): bot is created in PRIMARY only and
  # replicated to PAIRED via Lex GR — preserving bot ID and alias ARN cross-region so
  # the contact flow's hardcoded Lex alias ARN remains valid after ACGR replicates the
  # contact flow content.
  # When false: bot is created independently per region.
  ConnectChaosBot:
    Type: AWS::Lex::Bot
    Condition: CreateLexLocally
    Properties:
      Name: ConnectChaosBot
      Description: IVR bot for FIS chaos engineering sample
      RoleArn: !GetAtt LexBotRole.Arn
      DataPrivacy:
        # ChildDirected MUST be true if your contact center serves users under 13 (COPPA).
        # This sample is configured for general adult customer-service use; flip this if
        # your deployment targets minors.
        ChildDirected: false
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      # Lex Global Resiliency replication block — declared on the source (primary) bot.
      # When EnableLexGlobalResiliency=true and we're in the primary region, this triggers
      # Lex to replicate the bot, all versions, and all aliases to ReplicaRegion. Replicas
      # preserve the same bot ID and alias ARN, so downstream Connect contact flows can
      # reference a single ARN that resolves correctly in either region after ACGR replicates
      # the contact flow content.
      # Ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-properties-lex-bot-replication.html
      Replication: !If
        - UseLexGRPrimary
        - ReplicaRegions:
            - !Ref PairedRegion
        - !Ref AWS::NoValue
      BotLocales:
        - LocaleId: en_US
          NluConfidenceThreshold: 0.40
          Intents:
            - Name: LookupCustomer
              Description: Look up customer by account number
              SampleUtterances:
                - Utterance: I want to look up my account
                - Utterance: check my account
                - Utterance: my account number is {AccountNumber}
                - Utterance: look up account {AccountNumber}
              Slots:
                - Name: AccountNumber
                  SlotTypeName: AMAZON.Number
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: What is your account number?
                      MaxRetries: 2
              FulfillmentCodeHook:
                Enabled: true
            - Name: CheckOrderStatus
              Description: Check order status
              SampleUtterances:
                - Utterance: check my order
                - Utterance: where is my order {OrderId}
                - Utterance: order status for {OrderId}
              Slots:
                - Name: OrderId
                  SlotTypeName: AMAZON.AlphaNumeric
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: What is your order ID?
                      MaxRetries: 2
              FulfillmentCodeHook:
                Enabled: true
            - Name: FallbackIntent
              Description: Default fallback
              ParentIntentSignature: AMAZON.FallbackIntent

  ConnectChaosBotVersion:
    Type: AWS::Lex::BotVersion
    Condition: CreateLexLocally
    Properties:
      BotId: !GetAtt ConnectChaosBot.Id
      BotVersionLocaleSpecification:
        - LocaleId: en_US
          BotVersionLocaleDetails:
            SourceBotVersion: DRAFT

  ConnectChaosBotAlias:
    Type: AWS::Lex::BotAlias
    Condition: CreateLexLocally
    Properties:
      BotId: !GetAtt ConnectChaosBot.Id
      BotAliasName: live
      BotVersion: !GetAtt ConnectChaosBotVersion.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: en_US
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                CodeHookInterfaceVersion: '1.0'
                LambdaArn: !GetAtt LexFulfillmentHandler.Arn

  # ── Lambda ──
  LexFulfillmentHandler:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LexFulfillmentHandler
      # python3.13 (Amazon Linux 2023) — supported until Jun 30, 2029. Bump to the
      # latest supported runtime when you next update this sample. See:
      # https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtimes.html
      Runtime: python3.13
      Handler: lex_fulfillment_handler.lambda_handler
      Role: !GetAtt LexFulfillmentRole.Arn
      Timeout: 8
      MemorySize: 256
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: connect-chaos/lex_fulfillment_handler.zip
      Layers:
        - !Ref FISExtensionLayerArn
      Environment:
        Variables:
          CUSTOMER_TABLE_NAME: ConnectChaosCustomers
          CHAOS_TABLE_NAME: ConnectChaosConfig
          AWS_FIS_CONFIGURATION_LOCATION: !Sub '${FISConfigBucket.Arn}/FisConfigs/'
          AWS_LAMBDA_EXEC_WRAPPER: /opt/aws-fis/bootstrap
      VpcConfig:
        SubnetIds:
          - !Ref LambdaSubnetIdA
          - !Ref LambdaSubnetIdB
        SecurityGroupIds:
          - !Ref LambdaSecurityGroupId
      Tags:
        - Key: FISExperiment
          Value: ConnectChaos

  # ── Connect ↔ Lex association ──
  # A Lex V2 bot must be associated with the Connect instance before a flow may invoke it.
  # Deployed in BOTH regions and always built from THIS region's IDs, so each Connect
  # instance is associated with its own local bot:
  #   • Lex GR on  -> primary creates the bot; paired reuses the same (replicated) IDs
  #   • Lex GR off -> each region created its own bot, so each association is local
  # IntegrationArn format per the CFN reference:
  #   arn:aws:lex:<region>:<account>:bot-alias/<bot-id>/<alias-id>
  # Ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-connect-integrationassociation.html
  LexBotIntegrationAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref ConnectInstanceArn
      IntegrationType: LEX_BOT
      IntegrationArn: !Sub
        - 'arn:aws:lex:${AWS::Region}:${AWS::AccountId}:bot-alias/${BotId}/${BotAliasId}'
        - BotId: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
          BotAliasId: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]

  # Lex V2 → Lambda invocation permission (FulfillmentCodeHook).
  # The Lambda is invoked by Lex (acting as the code hook), not by Connect directly.
  # Connect calls Lex; Lex calls Lambda; Lambda returns to Lex; Lex returns to Connect.
  LexLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LexFulfillmentHandler
      Action: lambda:InvokeFunction
      Principal: lexv2.amazonaws.com
      SourceAccount: !Ref 'AWS::AccountId'

  TrafficShiftHandler:
    Type: AWS::Lambda::Function
    Condition: DeployAutoFailover
    Properties:
      FunctionName: ConnectChaos-TrafficShiftHandler
      Runtime: python3.13
      Handler: traffic_shift_handler.lambda_handler
      Role: !GetAtt TrafficShiftRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: connect-chaos/traffic_shift_handler.zip
      Environment:
        Variables:
          TRAFFIC_DISTRIBUTION_GROUP_ID: !Ref TrafficDistributionGroupId
          MY_REGION: !Ref 'AWS::Region'
          PRIMARY_REGION: !Ref PrimaryRegion
          PAIRED_REGION: !Ref PairedRegion

  # ── CloudWatch Alarms ──
  AlarmLambdaErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-Lambda-Errors-${AWS::Region}'
      AlarmDescription: 'Exp 1: Lambda invocation errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LexFulfillmentHandler
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmContactFlowErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-ContactFlow-Errors-${AWS::Region}'
      AlarmDescription: 'Exp 2: ContactFlowErrors from DDB disruption (sums across both workshop flows)'
      Metrics:
        # Connect publishes ContactFlowErrors with dimensions [InstanceId, MetricGroup, ContactFlowName].
        # An alarm without ContactFlowName matches no datapoints, so we sum across our two
        # known-named flows using a metric math expression.
        - Id: m1
          MetricStat:
            Metric:
              Namespace: AWS/Connect
              MetricName: ContactFlowErrors
              Dimensions:
                - Name: InstanceId
                  Value: !Ref ConnectInstanceId
                - Name: MetricGroup
                  Value: ContactFlow
                - Name: ContactFlowName
                  Value: ConnectChaos-MainIVR
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: m2
          MetricStat:
            Metric:
              Namespace: AWS/Connect
              MetricName: ContactFlowErrors
              Dimensions:
                - Name: InstanceId
                  Value: !Ref ConnectInstanceId
                - Name: MetricGroup
                  Value: ContactFlow
                - Name: ContactFlowName
                  Value: ConnectChaos-ChaosTest
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: total
          Expression: 'SUM([m1, m2])'
          Label: TotalContactFlowErrors
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: !Ref ContactFlowErrorsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmDynamoDBFaultErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-DDB-FISInducedErrors-${AWS::Region}'
      AlarmDescription: >-
        Exp 2: DynamoDB Region isolation. Counts FIS-injected HTTP 500s on the MRSC global
        table in THIS region — a labelled subset of SystemErrors, so it distinguishes
        experiment-induced failures from organic service errors.
      Metrics:
        # FaultInjectionServiceInducedErrors is published ONLY on the [TableName, Operation]
        # dimension pair — an alarm on TableName alone never matches data and stays in
        # INSUFFICIENT_DATA forever. We therefore enumerate the operations the sample
        # performs and sum them with metric math.
        # Ref: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/metrics-dimensions.html
        - Id: getitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: FaultInjectionServiceInducedErrors
              Dimensions:
                - Name: TableName
                  Value: ConnectChaosCustomers
                - Name: Operation
                  Value: GetItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: putitem
          MetricStat:
            Metric:
              Namespace: AWS/DynamoDB
              MetricName: FaultInjectionServiceInducedErrors
              Dimensions:
                - Name: TableName
                  Value: ConnectChaosCustomers
                - Name: Operation
                  Value: PutItem
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: total
          Expression: 'SUM([getitem, putitem])'
          Label: TotalFISInducedDDBErrors
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: !Ref DDBFaultErrorsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmLexRuntimeErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-Lex-RuntimeLambdaErrors-${AWS::Region}'
      AlarmDescription: 'Exp 3: Lex code hook timeout (sums across StartConversation/RecognizeUtterance/RecognizeText)'
      Metrics:
        # Lex V2 emits RuntimeLambdaErrors per Operation dimension. Amazon Connect integrates
        # with Lex V2 over the *streaming* API, so real voice IVR traffic reports the
        # Operation as StartConversation (InputMode=Speech) — NOT RecognizeUtterance.
        # Ref: https://docs.aws.amazon.com/lexv2/latest/dg/contact-center.html
        #      https://docs.aws.amazon.com/lexv2/latest/dg/streaming.html
        # We also include RecognizeUtterance (non-streaming speech, e.g. the synthetic
        # traffic generator) and RecognizeText (chat) so the alarm fires regardless of the
        # invocation path. Valid RuntimeLambdaErrors dimensions: Operation, BotId,
        # BotAliasId, InputMode, LocaleId.
        - Id: strm
          MetricStat:
            Metric:
              Namespace: AWS/Lex
              MetricName: RuntimeLambdaErrors
              Dimensions:
                - Name: BotId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
                - Name: BotAliasId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]
                - Name: Operation
                  Value: StartConversation
                - Name: InputMode
                  Value: Speech
                - Name: LocaleId
                  Value: en_US
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: utter
          MetricStat:
            Metric:
              Namespace: AWS/Lex
              MetricName: RuntimeLambdaErrors
              Dimensions:
                - Name: BotId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
                - Name: BotAliasId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]
                - Name: Operation
                  Value: RecognizeUtterance
                - Name: InputMode
                  Value: Speech
                - Name: LocaleId
                  Value: en_US
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: txt
          MetricStat:
            Metric:
              Namespace: AWS/Lex
              MetricName: RuntimeLambdaErrors
              Dimensions:
                - Name: BotId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
                - Name: BotAliasId
                  Value: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]
                - Name: Operation
                  Value: RecognizeText
                - Name: InputMode
                  Value: Text
                - Name: LocaleId
                  Value: en_US
            Period: 60
            Stat: Sum
          ReturnData: false
        - Id: total
          Expression: 'SUM([strm, utter, txt])'
          Label: TotalRuntimeLambdaErrors
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: !Ref RuntimeLambdaErrorsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  AlarmQueueWait:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-QueueWait-${AWS::Region}'
      AlarmDescription: >-
        Exp 4: contacts backing up in the no-agent overflow queue. Fires when the longest
        wait in ConnectChaos-Overflow exceeds the threshold (seconds).
      Namespace: AWS/Connect
      MetricName: LongestQueueWaitTime
      # Verified dimensions for LongestQueueWaitTime: InstanceId, MetricGroup=Queue, QueueName.
      Dimensions:
        - Name: InstanceId
          Value: !Ref ConnectInstanceId
        - Name: MetricGroup
          Value: Queue
        - Name: QueueName
          Value: ConnectChaos-Overflow
      # Longest wait is a gauge, not a rate — use Maximum over the period.
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: !Ref QueueWaitSecondsThreshold
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

  CompositeAlarm:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub 'ConnectChaos-Composite-${AWS::Region}'
      AlarmDescription: ANY component alarm triggers ACGR failover
      AlarmRule: !Sub 'ALARM("ConnectChaos-Lambda-Errors-${AWS::Region}") OR ALARM("ConnectChaos-DDB-FISInducedErrors-${AWS::Region}") OR ALARM("ConnectChaos-ContactFlow-Errors-${AWS::Region}") OR ALARM("ConnectChaos-Lex-RuntimeLambdaErrors-${AWS::Region}") OR ALARM("ConnectChaos-QueueWait-${AWS::Region}")'
      ActionsEnabled: true
      AlarmActions:
        - !Ref AlarmNotificationTopic
      OKActions:
        - !Ref AlarmNotificationTopic

  # SNS topic for human-in-the-loop alerts on composite alarm state changes.
  # Subscribers are added by the operator via the AWS Console after deploy
  # (we don't pre-subscribe an email because emails would need confirmation).
  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'ConnectChaos-AlarmNotifications-${AWS::Region}'
      DisplayName: ConnectChaos alarm notifications

  # ── FIS Experiment Templates ──
  FISExperimentLambdaFailure:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: 'Exp 1: Lambda invocation failure'
      RoleArn: !GetAtt FISExecutionRole.Arn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !GetAtt AlarmLambdaErrors.Arn
      Targets:
        LambdaFunction:
          ResourceType: aws:lambda:function
          ResourceArns:
            - !GetAtt LexFulfillmentHandler.Arn
          SelectionMode: ALL
      Actions:
        InjectError:
          ActionId: aws:lambda:invocation-error
          Parameters:
            duration: !Ref FISExperimentDuration
            preventExecution: 'true'
          Targets:
            Functions: LambdaFunction
      Tags:
        Name: ConnectChaos-Exp1-LambdaFailure

  # ── Exp 2 (primary): DynamoDB Region isolation on the MRSC global table ──
  # Pauses replication to/from THIS region. On an MRSC table this makes writes and strongly
  # consistent reads in the isolated region fail with FIS-injected HTTP 500s, surfacing as
  # AWS/DynamoDB FaultInjectionServiceInducedErrors. The fulfillment Lambda issues a
  # strongly consistent GetItem, so the fault is application-visible and drives failover.
  FISExperimentDDBRegionIsolation:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: 'Exp 2: DynamoDB MRSC Region isolation (pause global table replication)'
      RoleArn: !GetAtt FISExecutionRole.Arn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !GetAtt AlarmDynamoDBFaultErrors.Arn
      Targets:
        GlobalTable:
          ResourceType: aws:dynamodb:global-table
          ResourceArns:
            - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/ConnectChaosCustomers'
          SelectionMode: ALL
      Actions:
        PauseReplication:
          ActionId: aws:dynamodb:global-table-pause-replication
          Parameters:
            duration: !Ref FISExperimentDuration
          Targets:
            Tables: GlobalTable
      Tags:
        Name: ConnectChaos-Exp2-DDBRegionIsolation

  # ── Exp 2b (optional variant): DynamoDB unreachable at the network layer ──
  # Kept as an alternative "dependency unreachable" fault. Observable client-side only
  # (ContactFlowErrors) — it cannot produce AWS/DynamoDB metrics because the request never
  # reaches DynamoDB. Prefer Exp 2 for a DynamoDB-attributable signal.
  FISExperimentDDBDisruption:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: 'Exp 2b (variant): DynamoDB network disruption (targets ALL Lambda subnets for deterministic blast radius)'
      RoleArn: !GetAtt FISExecutionRole.Arn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !GetAtt AlarmContactFlowErrors.Arn
      Targets:
        Subnets:
          ResourceType: aws:ec2:subnet
          # Target every subnet the Lambda has an ENI in. If FIS only disrupts a subset,
          # invocations landing on the other ENI bypass the chaos non-deterministically.
          ResourceArns: !Split
            - ','
            - !Join
              - ','
              - - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${LambdaSubnetIdA}'
                - !Sub 'arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:subnet/${LambdaSubnetIdB}'
          SelectionMode: ALL
      Actions:
        DisruptDDB:
          ActionId: aws:network:disrupt-connectivity
          Parameters:
            duration: !Ref FISExperimentDuration
            scope: dynamodb
          Targets:
            Subnets: Subnets
      Tags:
        Name: ConnectChaos-Exp2-DDBDisruption

  FISExperimentLexTimeout:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: 'Exp 3: Lambda delay causing Lex code hook timeout'
      RoleArn: !GetAtt FISExecutionRole.Arn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !GetAtt AlarmLexRuntimeErrors.Arn
      Targets:
        LambdaFunction:
          ResourceType: aws:lambda:function
          ResourceArns:
            - !GetAtt LexFulfillmentHandler.Arn
          SelectionMode: ALL
      Actions:
        InjectDelay:
          ActionId: aws:lambda:invocation-add-delay
          Parameters:
            duration: !Ref FISExperimentDuration
            invocationPercentage: '100'
            startupDelayMilliseconds: '15000'
          Targets:
            Functions: LambdaFunction
      Tags:
        Name: ConnectChaos-Exp3-LexTimeout

  # ── EventBridge (both regions — either can failover) ──
  FailoverEventRule:
    Type: AWS::Events::Rule
    Condition: DeployAutoFailover
    Properties:
      Name: !Sub 'ConnectChaos-Failover-${AWS::Region}'
      EventPattern:
        source: [aws.cloudwatch]
        detail-type: ['CloudWatch Alarm State Change']
        detail:
          alarmName: [!Sub 'ConnectChaos-Composite-${AWS::Region}']
          state:
            value: [ALARM]
      Targets:
        - Id: TrafficShift
          Arn: !GetAtt TrafficShiftHandler.Arn

  FailoverEventPermission:
    Type: AWS::Lambda::Permission
    Condition: DeployAutoFailover
    Properties:
      FunctionName: !Ref TrafficShiftHandler
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FailoverEventRule.Arn

  # ── Dashboards ──
  RegionalDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: DeployRegionalDashboard
    Properties:
      DashboardName: !Sub 'ConnectChaos-${AWS::Region}'
      DashboardBody: !Sub
        - |
          {"widgets":[{"type":"metric","width":6,"height":6,"x":0,"y":0,"properties":{"title":"Exp 1: Lambda Errors vs Invocations","metrics":[["AWS/Lambda","Errors","FunctionName","LexFulfillmentHandler",{"stat":"Sum"}],["AWS/Lambda","Invocations","FunctionName","LexFulfillmentHandler",{"stat":"Sum"}]],"period":60,"region":"${AWS::Region}"}},{"type":"metric","width":6,"height":6,"x":6,"y":0,"properties":{"title":"Exp 2: DynamoDB FIS-Induced Errors","metrics":[["AWS/DynamoDB","FaultInjectionServiceInducedErrors","TableName","ConnectChaosCustomers","Operation","GetItem",{"stat":"Sum"}],["AWS/DynamoDB","SystemErrors","TableName","ConnectChaosCustomers","Operation","GetItem",{"stat":"Sum"}]],"period":60,"region":"${AWS::Region}"}},{"type":"metric","width":6,"height":6,"x":6,"y":6,"properties":{"title":"Exp 2b: ContactFlowErrors","metrics":[["AWS/Connect","ContactFlowErrors","InstanceId","${ConnectInstanceId}","MetricGroup","ContactFlow","ContactFlowName","ConnectChaos-MainIVR",{"stat":"Sum"}],["...","ConnectChaos-ChaosTest"]],"period":60,"region":"${AWS::Region}"}},{"type":"metric","width":6,"height":6,"x":12,"y":0,"properties":{"title":"Exp 3: Lex RuntimeLambdaErrors","metrics":[["AWS/Lex","RuntimeLambdaErrors","BotId","${BotId}","BotAliasId","${BotAliasId}","Operation","StartConversation","InputMode","Speech","LocaleId","en_US",{"stat":"Sum"}]],"period":60,"region":"${AWS::Region}"}},{"type":"metric","width":6,"height":6,"x":0,"y":6,"properties":{"title":"Exp 4: Queue Wait (Overflow)","metrics":[["AWS/Connect","LongestQueueWaitTime","InstanceId","${ConnectInstanceId}","MetricGroup","Queue","QueueName","ConnectChaos-Overflow",{"stat":"Maximum"}]],"period":60,"region":"${AWS::Region}"}}]}
        - BotId: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
          BotAliasId: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]

  UnifiedDashboard:
    Type: AWS::CloudWatch::Dashboard
    Condition: DeployUnifiedDashboard
    Properties:
      DashboardName: ConnectChaos-Unified
      DashboardBody: !Sub
        - |
          {"widgets":[{"type":"text","width":24,"height":1,"x":0,"y":0,"properties":{"markdown":"## Primary Region (${PrimaryRegion})"}},{"type":"metric","width":6,"height":5,"x":0,"y":1,"properties":{"title":"Lambda Errors vs Invocations","metrics":[["AWS/Lambda","Errors","FunctionName","LexFulfillmentHandler",{"stat":"Sum","region":"${PrimaryRegion}"}],["AWS/Lambda","Invocations","FunctionName","LexFulfillmentHandler",{"stat":"Sum","region":"${PrimaryRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":6,"y":1,"properties":{"title":"DynamoDB FIS-Induced Errors","metrics":[["AWS/DynamoDB","FaultInjectionServiceInducedErrors","TableName","ConnectChaosCustomers","Operation","GetItem",{"stat":"Sum","region":"${PrimaryRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":12,"y":1,"properties":{"title":"Lex RuntimeLambdaErrors","metrics":[["AWS/Lex","RuntimeLambdaErrors","BotId","${BotId}","BotAliasId","${BotAliasId}","Operation","StartConversation","InputMode","Speech","LocaleId","en_US",{"stat":"Sum","region":"${PrimaryRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":18,"y":1,"properties":{"title":"Queue Wait (Overflow)","metrics":[["AWS/Connect","LongestQueueWaitTime","InstanceId","${ConnectInstanceId}","MetricGroup","Queue","QueueName","ConnectChaos-Overflow",{"stat":"Maximum","region":"${PrimaryRegion}"}]],"period":60}},{"type":"text","width":24,"height":1,"x":0,"y":6,"properties":{"markdown":"## Paired Region (${PairedRegion})"}},{"type":"metric","width":6,"height":5,"x":0,"y":7,"properties":{"title":"Lambda Errors vs Invocations","metrics":[["AWS/Lambda","Errors","FunctionName","LexFulfillmentHandler",{"stat":"Sum","region":"${PairedRegion}"}],["AWS/Lambda","Invocations","FunctionName","LexFulfillmentHandler",{"stat":"Sum","region":"${PairedRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":6,"y":7,"properties":{"title":"DynamoDB FIS-Induced Errors","metrics":[["AWS/DynamoDB","FaultInjectionServiceInducedErrors","TableName","ConnectChaosCustomers","Operation","GetItem",{"stat":"Sum","region":"${PairedRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":12,"y":7,"properties":{"title":"Lex RuntimeLambdaErrors","metrics":[["AWS/Lex","RuntimeLambdaErrors","BotId","${BotId}","BotAliasId","${BotAliasId}","Operation","StartConversation","InputMode","Speech","LocaleId","en_US",{"stat":"Sum","region":"${PairedRegion}"}]],"period":60}},{"type":"metric","width":6,"height":5,"x":18,"y":7,"properties":{"title":"Queue Wait (Overflow)","metrics":[["AWS/Connect","LongestQueueWaitTime","InstanceId","${PairedInstanceIdEffective}","MetricGroup","Queue","QueueName","ConnectChaos-Overflow",{"stat":"Maximum","region":"${PairedRegion}"}]],"period":60}}]}
        - BotId: !GetAtt ConnectChaosBot.Id
          BotAliasId: !GetAtt ConnectChaosBotAlias.BotAliasId
          PairedInstanceIdEffective: !Ref PairedConnectInstanceId

  # ═══════════════════════════════════════════════════════════════
  # OPTIONAL: Synthetic Traffic Generator
  # ═══════════════════════════════════════════════════════════════

  TrafficGeneratorRole:
    Type: AWS::IAM::Role
    Condition: DeployTrafficGenerator
    Properties:
      RoleName: !Sub 'ConnectChaos-TrafficGenerator-${AWS::Region}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CloudWatchPutMetric
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace:
                      - AWS/Lambda
                      - AWS/Connect
                      - AWS/Lex
                      - AWS/DynamoDB

  TrafficGeneratorFunction:
    Type: AWS::Lambda::Function
    Condition: DeployTrafficGenerator
    Properties:
      FunctionName: !Sub 'ConnectChaos-TrafficGenerator-${AWS::Region}'
      Runtime: python3.13
      Handler: traffic_generator.handler
      Role: !GetAtt TrafficGeneratorRole.Arn
      Timeout: 60
      MemorySize: 128
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: connect-chaos/traffic_generator.zip
      Environment:
        Variables:
          CONNECT_INSTANCE_ID: !Ref ConnectInstanceId
          LEX_BOT_ID: !If [CreateLexLocally, !GetAtt ConnectChaosBot.Id, !Ref ReplicatedLexBotId]
          LEX_BOT_ALIAS_ID: !If [CreateLexLocally, !GetAtt ConnectChaosBotAlias.BotAliasId, !Ref ReplicatedLexBotAliasId]
          LAMBDA_FUNCTION_NAME: !Ref LexFulfillmentHandler
          QUEUE_NAME: ConnectChaos-Overflow
          QUEUE_WAIT_SECONDS: '120'
          CUSTOMER_TABLE_NAME: ConnectChaosCustomers
          MODE: healthy
          CALLS_PER_MINUTE: '10'

  TrafficGeneratorSchedule:
    Type: AWS::Events::Rule
    Condition: DeployTrafficGenerator
    Properties:
      Name: !Sub 'ConnectChaos-TrafficGen-Schedule-${AWS::Region}'
      Description: Generate synthetic baseline traffic every minute
      ScheduleExpression: 'rate(1 minute)'
      State: DISABLED
      Targets:
        - Id: TrafficGen
          Arn: !GetAtt TrafficGeneratorFunction.Arn

  TrafficGeneratorSchedulePermission:
    Type: AWS::Lambda::Permission
    Condition: DeployTrafficGenerator
    Properties:
      FunctionName: !Ref TrafficGeneratorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TrafficGeneratorSchedule.Arn

# ═══════════════════════════════════════════════════════════════
# OUTPUTS
# ═══════════════════════════════════════════════════════════════
Outputs:
  LexBotId:
    Condition: CreateLexLocally
    Value: !GetAtt ConnectChaosBot.Id
    Description: Lex V2 Bot ID. With Lex GR enabled this same ID exists in the paired region.
  LexBotAliasId:
    Condition: CreateLexLocally
    Value: !GetAtt ConnectChaosBotAlias.BotAliasId
    Description: Lex V2 Bot Alias ID. With Lex GR enabled this same ID exists in the paired region.
  LexBotAliasArn:
    Condition: CreateLexLocally
    Value: !GetAtt ConnectChaosBotAlias.Arn
    Description: Lex V2 Bot Alias ARN. With Lex GR enabled this same ARN is valid in the paired region.
  LambdaArn:
    Value: !GetAtt LexFulfillmentHandler.Arn
  FISExperiment1:
    Value: !Ref FISExperimentLambdaFailure
    Description: Lambda Failure
  FISExperiment2:
    Value: !Ref FISExperimentDDBRegionIsolation
    Description: 'Exp 2: DynamoDB MRSC Region isolation (pause replication)'
  FISExperiment2bNetworkVariant:
    Value: !Ref FISExperimentDDBDisruption
    Description: 'Exp 2b (variant): DynamoDB network disruption'
  FISExperiment3:
    Value: !Ref FISExperimentLexTimeout
    Description: Lex Timeout
  CompositeAlarmArn:
    Value: !GetAtt CompositeAlarm.Arn
  Region:
    Value: !Ref 'AWS::Region'
  TrafficGeneratorArn:
    Condition: DeployTrafficGenerator
    Value: !GetAtt TrafficGeneratorFunction.Arn
    Description: Synthetic traffic generator Lambda ARN
